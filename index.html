<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="3.4 Function and Perameters">
        <p id="welcome"></p>
        
        <input type="text" id="fName" placeholder="First Name">
        <input type="text" id="lName" placeholder="Last Name">
        <br>
        <br>
        <button id="showBtn">Click Me!</button>
        <p id="result"></p>
    </div>
    <br><br>
    <div class="5.4 Loops and DOM">
        <h2 id="mainTitle">Hero Training Acadamey</h2>
        <p>Animal: <b>Cat, Dog, Bird, or Lizard?</b></p>
        <input type="text" id="petName" oninput="changeTitleColor()" placeholder="Hero Name">
        <input type="text" id="animal" placeholder="Animal">
        <input type="text" id="petPower" placeholder="Power Level (1-10)">
        <br><br>
        <button onclick="startTraining()">Beging Training</button>

        <div id="heroCard">
            <h2 id="cardTitle">Hero Status</h2>
            <div class="stats-box">
                <p id="bioOutput">Enter Details to train!</p>
                <hr>
                <p><b>Training Log:</b></p>
                <ul id="trainingLog"></ul>
            </div>
        </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
