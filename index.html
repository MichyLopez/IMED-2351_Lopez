<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div class="container">
        <h1 id="mainTitle" style="text-align: center;">Hero Academy Dashboard</h1>
        <input type="text" id="petName" oninput="changeTitleColor()" placeholder="Pet Name">
        <input type="text" id="animal" placeholder="Dog, Cat, Bird, or Lizard">
        <input type="number" id="petPower" placeholder="Number">
        <br><br>
        <button onclick="startTraining()">Begin Training</button>

        <hr>
        <div id="heroCard">
            <h3>Hero Status</h3>
            <p id="bioOutput">Enter details above...</p>
            <ul id="trainingLog" style="text-align: left;"></ul>
        </div>

        <div class="inventory-section">
            <h4>Inventory Vault</h4>
            <p id="mottoDisplay"></p>
            <p><b>Items:</b> <span id="itemsList">No items yet</span></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
